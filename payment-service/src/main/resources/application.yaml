server:
  port: 8082
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payment}
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:payment-local}
    hikari:
      # 예약 DB와 동일한 기준으로 승인 기한을 비교한다.
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
payment:
  mock:
    min-millis: ${PAYMENT_MIN_MILLIS:200}
    max-millis: ${PAYMENT_MAX_MILLIS:5000}
    failure-rate: ${PAYMENT_FAILURE_RATE:0.1}
management:
  endpoints:
    web:
      exposure:
        # 로컬 관측용 메트릭과 Prometheus 수집 주소를 연다.
        include: health,metrics,prometheus
  tracing:
    sampling:
      # 실습에서는 모든 요청을 추적한다.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # 메트릭은 Collector가 Actuator에서 읽으므로 OTLP로 중복 전송하지 않는다.
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        reservation.hold: true
        reservation.checkout: true
        reservation.confirmation: true
        payment.mock: true
      maximum-expected-value:
        # 접수부터 확정까지는 화면 체류와 재확인 시간도 포함한다.
        reservation.confirmation: 10m
logging:
  file:
    # Compose에서는 APP_LOG_FILE로 공유 볼륨의 앱별 경로를 지정한다.
    name: ${APP_LOG_FILE:./logs/${spring.application.name}/application.log}
  logback:
    rollingpolicy:
      # 압축하지 않아 Collector가 순환된 파일도 읽을 수 있게 한다.
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB
  structured:
    format:
      # MDC의 traceId와 reservationId를 JSON 필드로 출력한다.
      console: logstash
      file: logstash
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 선점 또는 결제 중에만 상태를 다시 읽는다. -->
    <meta th:if="${reservation.status == 'HELD' or reservation.status == 'PAYMENT_PENDING'}" http-equiv="refresh" content="10">
    <title>예약 상세</title>
    <link rel="stylesheet" th:href="@{/search.css}">
</head>
<body>
<main>
    <h1>예약 상세</h1>
    <p th:if="${paymentNotice != null}" th:text="${paymentNotice}" role="status"></p>
    <div th:switch="${reservation.status}">
        <p th:case="'HELD'">차량을 선점했습니다. 만료 전에 결제를 진행해 주세요.</p>
        <p th:case="'PAYMENT_PENDING'">결제 결과를 확인하고 있습니다. 같은 예약으로 다시 확인할 수 있습니다.</p>
        <p th:case="'CONFIRMED'">결제가 완료되어 예약이 확정되었습니다.</p>
        <p th:case="'PAYMENT_FAILED'">결제가 승인되지 않아 차량 배정이 해제되었습니다. 차량을 다시 검색해 주세요.</p>
        <p th:case="'EXPIRED'">선점이 만료되었습니다. 차량을 다시 검색해 주세요.</p>
    </div>
    <dl class="reservation-detail">
        <dt>예약 ID</dt><dd th:text="${reservation.id}"></dd>
        <dt>상태</dt><dd th:text="${reservation.status}"></dd>
        <dt>차량</dt><dd th:text="${reservation.vehicleName}"></dd>
        <dt>인수 시각</dt><dd th:text="${reservation.pickupAtText()}"></dd>
        <dt>반납 시각</dt><dd th:text="${reservation.returnAtText()}"></dd>
        <dt>승인 기한</dt><dd th:text="${reservation.expiresAtText()}"></dd>
        <dt>예약 요금</dt><dd th:text="|${#numbers.formatInteger(reservation.amount, 1, 'COMMA')}원|"></dd>
    </dl>
    <!-- 예약 ID만 전달하고 금액은 서버에 저장한 값을 사용한다. -->
    <form th:if="${reservation.status == 'HELD' or reservation.status == 'PAYMENT_PENDING'}"
          th:action="@{/reservations/{id}/payment(id=${reservation.id})}" method="post">
        <button type="submit" th:text="${reservation.status == 'HELD' ? '모의 결제' : '결제 결과 다시 확인'}"></button>
    </form>
    <a th:href="@{/}">차량 검색</a>
</main>
<script>
    // 전송 중 중복 클릭을 줄인다. 최종 중복 처리는 서버에서 막는다.
    document.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', () => {
            form.querySelector('button').disabled = true;
        });
    });
</script>
</body>
</html>

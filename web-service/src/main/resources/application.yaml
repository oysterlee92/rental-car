server:
  port: 8080
spring:
  application:
    name: web-service
reservation:
  # Compose에서는 서비스 이름을, 로컬 JDK 실행에서는 localhost를 사용한다.
  base-url: ${RESERVATION_BASE_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        # 로컬 관측용 메트릭과 Prometheus 수집 주소를 연다.
        include: health,metrics,prometheus
  tracing:
    sampling:
      # 실습에서는 모든 요청을 추적한다.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # 메트릭은 Prometheus가 가져가므로 OTLP로 중복 전송하지 않는다.
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        reservation.hold: true
        reservation.checkout: true
        reservation.confirmation: true
        payment.mock: true
      maximum-expected-value:
        # 접수부터 확정까지는 화면 체류와 재확인 시간도 포함한다.
        reservation.confirmation: 10m
logging:
  structured:
    format:
      # MDC의 traceId와 reservationId를 JSON 필드로 출력한다.
      console: logstash
plugins {
    // 앱 모듈에서만 Boot 플러그인을 적용해 서비스별 실행 JAR를 만든다.
    id 'org.springframework.boot' version '4.2.0' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'

    group = 'com.example.rental'
    version = '0.0.1-SNAPSHOT'

    java {
        // 빌드에 사용하는 JDK 버전을 두 서비스에서 동일하게 맞춘다.
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // Boot의 BOM으로 하위 모듈 라이브러리의 호환 버전을 함께 관리한다.
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Spring이 요청 파라미터와 Java 매개변수를 이름으로 연결할 수 있게 한다.
        options.compilerArgs.add('-parameters')
    }

    tasks.named('bootJar') {
        // Dockerfile이 서비스 이름으로 실행 파일을 찾도록 JAR 이름을 고정한다.
        archiveFileName = "${project.name}.jar"
    }

    tasks.named('jar') {
        // 배포에는 의존성이 포함된 bootJar를 사용한다.
        enabled = false
    }
}
server:
  port: 8081
spring:
  application:
    name: reservation-service
  datasource:
    # Compose에서는 환경 변수로 DB 주소를 전달하고 로컬 실행에는 기본값을 쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation-local}
    hikari:
      # 새 DB 연결도 설정한 시간대를 사용한다.
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    # DB 조회는 서비스의 트랜잭션 안에서 마치고, 컨트롤러에서는 DB 연결을 유지하지 않는다.
    open-in-view: false
    hibernate:
      # 테이블은 Flyway가 만든다. JPA는 테이블 구조와 엔티티 설정이 맞는지 확인한다.
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        # 로컬 관측용 메트릭과 Prometheus 수집 주소를 연다.
        include: health,metrics,prometheus
  tracing:
    sampling:
      # 실습에서는 모든 요청을 추적한다.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # 메트릭은 Prometheus가 가져가므로 OTLP로 중복 전송하지 않는다.
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        reservation.hold: true
        reservation.checkout: true
        reservation.confirmation: true
        payment.mock: true
      maximum-expected-value:
        # 접수부터 확정까지는 화면 체류와 재확인 시간도 포함한다.
        reservation.confirmation: 10m
logging:
  structured:
    format:
      # MDC의 traceId와 reservationId를 JSON 필드로 출력한다.
      console: logstash
reservation:
  # 새 예약의 선점을 5분 동안 유지한다.
  hold-duration: PT5M
payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8082}
  # 결제 결과 재확인 배치가 끝난 뒤 기다릴 밀리초다.
  recovery-delay: ${PAYMENT_RECOVERY_DELAY:10000}
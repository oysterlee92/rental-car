dependencies {
    // HTTP 요청 처리, JPA 조회, Flyway의 테이블 생성에 필요한 라이브러리를 추가한다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Flyway가 PostgreSQL에 마이그레이션 SQL을 실행할 수 있도록 지원 모듈을 추가한다.
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 앱이 PostgreSQL에 접속할 때 사용할 JDBC 드라이버를 추가한다.
    runtimeOnly 'org.postgresql:postgresql'
    // Prometheus 메트릭과 OpenTelemetry 분산 추적을 연결한다.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // 자동 설정된 RestClient.Builder로 HTTP 추적 정보를 전파한다.
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
}